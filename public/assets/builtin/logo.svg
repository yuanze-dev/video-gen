<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="小音符起号助手">
  <defs>
    <linearGradient id="nl-bg" x1="56" y1="32" x2="456" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7ab6"/>
      <stop offset="0.52" stop-color="#ff3d86"/>
      <stop offset="1" stop-color="#ec1f74"/>
    </linearGradient>
    <radialGradient id="nl-sheen" cx="0.3" cy="0.16" r="0.92">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nl-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#74012e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#nl-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#nl-sheen)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="119.25" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="1.5"/>

  <!-- note glyph (white parts) -->
  <g filter="url(#nl-shadow)">
    <!-- flag -->
    <path d="M300 124 C 384 132 404 206 340 262 C 384 210 366 160 300 180 Z" fill="#ffffff"/>
    <!-- stem -->
    <rect x="262" y="120" width="44" height="210" rx="22" fill="#ffffff"/>
    <!-- note head -->
    <circle cx="198" cy="320" r="84" fill="#ffffff"/>
  </g>

  <!-- play button knockout (continues the background gradient) -->
  <path d="M180 290 L180 350 L230 320 Z" fill="url(#nl-bg)" stroke="url(#nl-bg)" stroke-width="18" stroke-linejoin="round"/>
</svg>
