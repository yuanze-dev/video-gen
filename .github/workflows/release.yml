name: Release (macOS)

# Push a version tag (e.g. v0.1.1) to build, sign, notarize and publish the dmg.
# Recommended flow:  npm version patch  &&  git push --follow-tags
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create/upload the GitHub Release

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message if signing/notarization secrets are absent.
      # (GitHub passes unset secrets as empty strings, which makes electron-builder
      # choke with a cryptic "not a file" error.)
      - name: Check required secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          miss=""
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then miss="$miss $v"; fi
          done
          if [ -n "$miss" ]; then
            echo "::error::Missing required repo secrets:$miss — add them in Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets present."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure headless Chromium (chrome-headless-shell)
        run: node scripts/ensure-chrome.mjs

      - name: Build Remotion site + Electron bundles
        run: |
          npm run build:remotion-site
          npm run build:electron

      # Sign with the Developer ID cert (CSC_LINK = base64 of the .p12).
      # --publish never: we publish explicitly below (and notarize the dmg first).
      # APPLE_* are intentionally NOT exposed here, so the afterSign notarize hook
      # stays a no-op and we notarize the dmg explicitly in the next step.
      - name: Build & sign (Developer ID)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --mac --publish never

      - name: Notarize + staple dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="$(ls release/*.dmg | head -1)"
          echo "Notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          DMG="$(ls release/*.dmg | head -1)"
          echo "Publishing $DMG to release $VERSION"
          gh release create "$VERSION" "$DMG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "小音符起号助手 $VERSION" \
            --notes "macOS (Apple Silicon) build — Developer ID signed + Apple notarized. Double-click → drag to Applications → open." \
          || gh release upload "$VERSION" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"
