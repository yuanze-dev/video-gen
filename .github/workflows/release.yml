name: Release (macOS)

# Push a stable version tag on main (e.g. v0.2.4) to build, sign, notarize and publish.
on:
  push:
    tags:
      - "v*"

concurrency:
  # Every production tag shares one lane. Version-specific groups allow an
  # older, slower build to publish after a newer tag and steal /releases/latest.
  group: release-macos-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release source and approval gates
        env:
          CLI_DISTRIBUTION_APPROVED: ${{ vars.CLI_DISTRIBUTION_APPROVED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match stable package version $EXPECTED"
            exit 1
          fi
          TAGGED_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT" origin/main; then
            echo "::error::Release tag must point to a commit contained in origin/main"
            exit 1
          fi
          PUBLIC_TAGS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          TARGET_TAG="$GITHUB_REF_NAME" PUBLIC_TAGS="$PUBLIC_TAGS" node <<'NODE'
          const parseStable = (tag) => {
            const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag);
            return match ? match.slice(1).map(Number) : null;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };
          const targetTag = process.env.TARGET_TAG;
          const target = parseStable(targetTag);
          if (!target) throw new Error(`Production tag must be stable semver: ${targetTag}`);
          const publicTags = (process.env.PUBLIC_TAGS ?? "").split(/\r?\n/).filter(Boolean);
          const blockingTag = publicTags.find((tag) => {
            const parsed = parseStable(tag);
            return parsed && compare(parsed, target) >= 0;
          });
          if (blockingTag) {
            throw new Error(
              `Release ${targetTag} must be newer than every public stable release; found ${blockingTag}`,
            );
          }
          NODE
          if grep -Eq '^\| .* \| `REQUIRES_CONFIRMATION` \|$' ASSET_RIGHTS.md; then
            echo "::error::Bundled media distribution rights are still unconfirmed"
            exit 1
          fi
          cmp -s ASSET_RIGHTS.md packages/littlestart-cli/ASSET_RIGHTS.md || {
            echo "::error::Packaged asset-rights inventory is out of sync"
            exit 1
          }
          cmp -s THIRD_PARTY_NOTICES.md packages/littlestart-cli/THIRD_PARTY_NOTICES.md || {
            echo "::error::Packaged third-party notices are out of sync"
            exit 1
          }
          if [ "$CLI_DISTRIBUTION_APPROVED" != "true" ]; then
            echo "::error::Set CLI_DISTRIBUTION_APPROVED=true after Remotion and third-party review"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Ensure headless Chromium
        run: node scripts/ensure-chrome.mjs

      - name: Verify Web, CLI, updater and Electron bundles
        run: |
          set -euo pipefail
          npm run build
          npx tsc --noEmit
          npm run typecheck:electron
          npm run typecheck:tests
          npm run test:update
          npm run test:desktop
          npm run test:cli
          npm run test:cli:repro
          npm run test:skills
          npm run build:cli
          npm run build:electron
          npm audit --omit=dev --audit-level=high

      # electron-builder starts separate asynchronous DMG and ZIP publishers.
      # Pre-creating one current draft prevents them from racing into duplicate
      # Release objects. Recreate an old draft because electron-publish only
      # searches the first Releases API page.
      - name: Prepare unique draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$GITHUB_REF_NAME"
          MATCHES="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -c --arg VERSION "$VERSION" '[.[][] | select(.tag_name == $VERSION)]')"
          COUNT="$(jq 'length' <<<"$MATCHES")"
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Found $COUNT release objects for $VERSION"
            exit 1
          fi
          if [ "$COUNT" -eq 1 ]; then
            IS_DRAFT="$(jq -r '.[0].draft' <<<"$MATCHES")"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Refusing to overwrite an already-public release for $VERSION"
              exit 1
            fi
            RELEASE_ID="$(jq -r '.[0].id' <<<"$MATCHES")"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          fi
          gh release create "$VERSION" --verify-tag --draft --title "$VERSION" --generate-notes

      - name: Build, sign, notarize and upload
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --mac --publish always

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RAW="$(node -p "require('./package.json').version")"
          VERSION="$GITHUB_REF_NAME"
          ZIP_NAME="littlestart-$RAW-arm64-mac.zip"
          BLOCKMAP_NAME="$ZIP_NAME.blockmap"
          DMG_NAME="littlestart-$RAW-arm64.dmg"
          MATCHES="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -c --arg VERSION "$VERSION" '[.[][] | select(.tag_name == $VERSION)]')"
          COUNT="$(jq 'length' <<<"$MATCHES")"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected one release object for $VERSION, found $COUNT"
            exit 1
          fi
          RELEASE_ID="$(jq -r '.[0].id' <<<"$MATCHES")"
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if [ "$(jq -r '.tag_name' <<<"$RELEASE")" != "$VERSION" ]; then
            echo "::error::Release $RELEASE_ID changed tag"
            exit 1
          fi
          if [ "$(jq -r '.draft' <<<"$RELEASE")" != "true" ]; then
            echo "::error::Release $VERSION became public before verification"
            exit 1
          fi

          for redundant in "video-gen-$RAW-arm64-mac.zip" "littlestart-$RAW-arm64.dmg.blockmap"; do
            ASSET_ID="$(jq -r --arg name "$redundant" \
              '[.assets[] | select(.name == $name) | .id][0] // empty' <<<"$RELEASE")"
            if [ -n "$ASSET_ID" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"
            fi
          done

          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          EXPECTED_ASSETS="$(printf '%s\n' \
            latest-mac.yml "$ZIP_NAME" "$BLOCKMAP_NAME" "$DMG_NAME" | LC_ALL=C sort)"
          ACTUAL_ASSETS="$(jq -r '.assets[].name' <<<"$RELEASE" | LC_ALL=C sort)"
          if [ "$ACTUAL_ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "::error::Release assets do not match the exact updater set"
            printf 'Expected:\n%s\nActual:\n%s\n' "$EXPECTED_ASSETS" "$ACTUAL_ASSETS"
            exit 1
          fi
          for asset in latest-mac.yml "$ZIP_NAME" "$BLOCKMAP_NAME" "$DMG_NAME"; do
            SIZE="$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name) | .size][0] // 0' <<<"$RELEASE")"
            if [ "$SIZE" -le 0 ]; then
              echo "::error::Missing or empty release asset: $asset"
              exit 1
            fi
          done

          PUBLIC_TAGS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          TARGET_TAG="$VERSION" PUBLIC_TAGS="$PUBLIC_TAGS" node <<'NODE'
          const parseStable = (tag) => {
            const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag);
            return match ? match.slice(1).map(Number) : null;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };
          const targetTag = process.env.TARGET_TAG;
          const target = parseStable(targetTag);
          if (!target) throw new Error(`Production tag must be stable semver: ${targetTag}`);
          const publicTags = (process.env.PUBLIC_TAGS ?? "").split(/\r?\n/).filter(Boolean);
          const blockingTag = publicTags.find((tag) => {
            const parsed = parseStable(tag);
            return parsed && compare(parsed, target) >= 0;
          });
          if (blockingTag) {
            throw new Error(`Refusing to publish ${targetTag}; ${blockingTag} is not older`);
          }
          NODE

          VERIFY_DIR="$RUNNER_TEMP/release-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          for asset in latest-mac.yml "$ZIP_NAME" "$DMG_NAME"; do
            ASSET_ID="$(jq -r --arg name "$asset" \
              '[.assets[] | select(.name == $name) | .id][0] // empty' <<<"$RELEASE")"
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > "$VERIFY_DIR/$asset"
          done

          VERIFY_DIR="$VERIFY_DIR" RAW="$RAW" ZIP_NAME="$ZIP_NAME" DMG_NAME="$DMG_NAME" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const yaml = require("js-yaml");

          const fail = (message) => {
            throw new Error(`Invalid latest-mac.yml: ${message}`);
          };
          const hashFile = (filePath) =>
            new Promise((resolve, reject) => {
              const hash = crypto.createHash("sha512");
              const stream = fs.createReadStream(filePath);
              stream.on("data", (chunk) => hash.update(chunk));
              stream.on("error", reject);
              stream.on("end", () => resolve(hash.digest("base64")));
            });

          const verify = async () => {
            const directory = process.env.VERIFY_DIR;
            const rawVersion = process.env.RAW;
            const zipName = process.env.ZIP_NAME;
            const dmgName = process.env.DMG_NAME;
            const manifest = yaml.load(
              fs.readFileSync(path.join(directory, "latest-mac.yml"), "utf8"),
            );
            if (!manifest || typeof manifest !== "object" || Array.isArray(manifest)) {
              fail("root must be a mapping");
            }
            if (String(manifest.version) !== rawVersion) fail(`version must be ${rawVersion}`);
            if (manifest.path !== zipName) fail(`path must be ${zipName}`);
            if (!Array.isArray(manifest.files) || manifest.files.length !== 2) {
              fail("files must contain exactly the updater ZIP and DMG");
            }
            const filesByUrl = new Map();
            for (const file of manifest.files) {
              if (!file || typeof file !== "object" || typeof file.url !== "string") {
                fail("every files entry must be a mapping with a URL");
              }
              if (filesByUrl.has(file.url)) fail(`duplicate files URL: ${file.url}`);
              filesByUrl.set(file.url, file);
            }
            if (
              filesByUrl.size !== 2 ||
              !filesByUrl.has(zipName) ||
              !filesByUrl.has(dmgName)
            ) {
              fail(`files URLs must be exactly ${zipName} and ${dmgName}`);
            }
            let zipDigest;
            for (const artifactName of [zipName, dmgName]) {
              const file = filesByUrl.get(artifactName);
              const artifactPath = path.join(directory, artifactName);
              const size = fs.statSync(artifactPath).size;
              if (!Number.isSafeInteger(file.size) || file.size !== size) {
                fail(`${artifactName} size does not match the uploaded asset (${size})`);
              }
              const digest = await hashFile(artifactPath);
              if (file.sha512 !== digest) {
                fail(`${artifactName} sha512 does not match the uploaded asset`);
              }
              if (artifactName === zipName) zipDigest = digest;
            }
            if (manifest.sha512 !== zipDigest) {
              fail("top-level sha512 does not match the uploaded ZIP");
            }
          };

          verify().catch((error) => {
            console.error(`::error::${error instanceof Error ? error.message : String(error)}`);
            process.exitCode = 1;
          });
          NODE

          FINAL_RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          if [ "$(jq -r '.tag_name' <<<"$FINAL_RELEASE")" != "$VERSION" ] || \
             [ "$(jq -r '.draft' <<<"$FINAL_RELEASE")" != "true" ]; then
            echo "::error::Release changed before publication"
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true >/dev/null
