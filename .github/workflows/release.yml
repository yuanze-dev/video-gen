name: Release (macOS)

# Push a version tag (e.g. v0.1.1) to build, sign, notarize and publish the dmg.
# Recommended flow:  npm version patch  &&  git push --follow-tags
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read # release assets go to the separate public repo via RELEASES_TOKEN

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message if signing/notarization secrets are absent.
      # (GitHub passes unset secrets as empty strings, which makes electron-builder
      # choke with a cryptic "not a file" error.)
      - name: Check required secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # PAT (Contents: write) on the PUBLIC yuanze-dev/video-gen-releases repo.
          # The default GITHUB_TOKEN only reaches this repo, so a cross-repo publish
          # needs its own token.
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          miss=""
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID RELEASES_TOKEN; do
            if [ -z "${!v}" ]; then miss="$miss $v"; fi
          done
          if [ -n "$miss" ]; then
            echo "::error::Missing required repo secrets:$miss — add them in Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required secrets present."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure headless Chromium (chrome-headless-shell)
        run: node scripts/ensure-chrome.mjs

      - name: Build Remotion site + Electron bundles
        run: |
          npm run build:remotion-site
          npm run build:electron

      # One step does it all now that auto-update is in play:
      #   • CSC_*  → sign the .app with the Developer ID cert (CSC_LINK = base64 .p12)
      #   • APPLE_* → afterSign hook (build/notarize.cjs) notarizes AND staples the
      #     .app, so BOTH the dmg and the auto-update zip ship a stapled, notarized
      #     app (a dmg-only notarize would leave the zip's app unstapled → updates
      #     download but Gatekeeper rejects them).
      #   • GH_TOKEN → --publish always uploads dmg + zip + latest-mac.yml +
      #     blockmap to the PUBLIC yuanze-dev/video-gen-releases repo (see the
      #     publish: block in electron-builder.yml). The client reads that feed
      #     with no token.
      - name: Build, sign, notarize & publish
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder --mac --publish always
